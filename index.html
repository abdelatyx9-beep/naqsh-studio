<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>استوديو نقش</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Reem+Kufi:wght@500;700&family=Cairo:wght@400;700;900&family=Tajawal:wght@400;700;900&family=Amiri:wght@400;700&family=Lalezar&family=Changa:wght@400;800&family=Almarai:wght@400;800&family=El+Messiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Marhey:wght@400;700&family=Rakkas&family=Lemonada:wght@400;700&family=Playfair+Display:wght@400;900&family=Bebas+Neue&family=Pacifico&family=Montserrat:wght@400;800&family=Oswald:wght@400;700&family=Lobster&display=swap">
<style>
/* Layout: a framed editor window — menu bar, tool options, tool rail | canvas | panel column, status bar.
   Single deliberate dark look (graphite with violet bias, saffron-gold accent) like a professional editing suite. */
:root{
  --ground:#e9ebef; --bg:#f6f7f9; --panel:#ffffff; --panel-2:#f2f3f6; --panel-3:#e6e8ed;
  --line:#dfe2e8; --line-2:#cdd2da; --fg:#1d2026; --muted:#5a616c; --dim:#8a909a;
  --accent:#2f80ed; --accent-2:#2f80ed; --accent-ink:#ffffff; --accent-soft:rgba(47,128,237,.12); --accent-line:rgba(47,128,237,.45);
  --pop:#ffffff; --gold:#b9821c;
  --danger:#ff6b6b; --ok:#5fd39a; --info:#7aa7ff;
  --f-ui:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px; --r-s:6px; --fs:13px;
  color-scheme:light;
}
html{height:100%;box-sizing:border-box;background:var(--ground)}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--ground);color:var(--fg);font-family:var(--f-ui);font-size:var(--fs);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=number]{font-family:var(--f-mono)}
#app{position:relative;height:100%;display:grid;grid-template-rows:auto 1fr;background:var(--bg);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:0 10px;height:46px;background:var(--bg);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:19px;color:var(--gold);white-space:nowrap;letter-spacing:.01em}
.brand svg{width:24px;height:24px}
.tb-start,.tb-end{display:flex;align-items:center;gap:8px;flex:none}
.tb-sep{width:1px;height:22px;background:var(--line-2);flex:none}
.home-btn{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-2);font-weight:600}
.home-btn svg{width:16px;height:16px}
.home-btn:hover{background:var(--accent);color:var(--accent-ink)}
.brand{cursor:pointer}
.menus{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
.menus::-webkit-scrollbar{display:none}
.menu-btn{background:none;border:0;padding:6px 10px;border-radius:6px;color:var(--fg);white-space:nowrap}
.menu-btn:hover,.menu-btn.open{background:var(--panel-3)}
.ws-tabs{display:flex;background:var(--ground);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.ws-tabs button{border:0;background:none;padding:5px 14px;border-radius:6px;color:var(--muted);font-weight:600;white-space:nowrap}
.ws-tabs button.on{background:var(--panel-3);color:var(--accent-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:var(--panel-2);border-radius:var(--r-s);padding:6px 12px;white-space:nowrap;color:var(--fg)}
.btn:hover{background:var(--panel-3);border-color:var(--accent-line)}
.btn.primary{background:linear-gradient(180deg,var(--accent-2),var(--accent));color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--danger);border-color:rgba(255,107,107,.45)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.icon{padding:5px;width:30px;height:30px}
.btn svg{width:16px;height:16px;flex:none}
.btn[disabled]{opacity:.45;pointer-events:none}
.save-state{font-size:11.5px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.save-state i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.save-state.busy i{background:var(--accent)}

/* ---------- menus dropdown ---------- */
.dropdown{position:fixed;z-index:60;min-width:230px;max-height:70vh;overflow:auto;background:var(--pop);border:1px solid var(--line-2);border-radius:10px;padding:5px;box-shadow:0 18px 50px rgba(0,0,0,.55)}
.dropdown button{display:flex;width:100%;justify-content:space-between;gap:18px;background:none;border:0;padding:7px 10px;border-radius:6px;text-align:start}
.dropdown button:hover{background:var(--accent-soft);color:var(--accent-2)}
.dropdown kbd{font-family:var(--f-mono);font-size:11px;color:var(--dim);direction:ltr}
.dropdown hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.dropdown .grp{font-size:11px;color:var(--dim);padding:6px 10px 2px;letter-spacing:.04em}

/* ---------- workspace ---------- */
.ws{min-height:0;display:grid;grid-row:2;grid-column:1}
#ws-design{grid-template-rows:auto 1fr auto}
.optbar{display:flex;align-items:center;gap:12px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin;min-height:42px;white-space:nowrap}
.optbar .tname{font-weight:700;color:var(--accent-2);padding-inline-end:6px;border-inline-end:1px solid var(--line);margin-inline-end:2px}
.ctl{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.ctl input[type=range]{width:96px}
.ctl output{font-family:var(--f-mono);color:var(--fg);min-width:34px;font-size:11.5px;direction:ltr;text-align:center}
.ctl select,.ctl input[type=number],.ctl input[type=text]{background:var(--ground);border:1px solid var(--line-2);border-radius:5px;padding:3px 6px;color:var(--fg);max-width:150px}
.ctl input[type=number]{width:68px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden}
.seg button{background:var(--ground);border:0;padding:4px 9px;color:var(--muted);font-size:12px}
.seg button+button{border-inline-start:1px solid var(--line-2)}
.seg button.on{background:var(--accent-soft);color:var(--accent-2)}
.seg button svg{width:15px;height:15px;vertical-align:middle}
input[type=range]{accent-color:var(--accent);height:16px}
input[type=checkbox]{accent-color:var(--accent)}
input[type=color]{width:28px;height:22px;padding:0;border:1px solid var(--line-2);border-radius:4px;background:none}

.work{display:grid;grid-template-columns:48px 1fr 300px;min-height:0;direction:ltr}
.work>.panels,.work>.toolbar{direction:rtl}
.panels{border-left:1px solid var(--line)}
.toolbar{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;overflow-y:auto;scrollbar-width:none}
.toolbar::-webkit-scrollbar{display:none}
.tool{width:38px;height:36px;border:0;background:none;border-radius:7px;display:grid;place-items:center;color:var(--muted);position:relative;flex:none}
.tool svg{width:20px;height:20px}
.tool:hover{background:var(--panel-3);color:var(--fg)}
.tool.on{background:var(--accent-soft);color:var(--accent-2);box-shadow:inset 0 0 0 1px var(--accent-line)}
.tsep{width:26px;border-top:1px solid var(--line);margin:4px 0;flex:none}
.swatches{position:relative;width:40px;height:44px;margin-top:8px;flex:none}
.swatches .sw{position:absolute;width:26px;height:26px;border-radius:5px;border:2px solid #fff;box-shadow:0 0 0 1px #000;cursor:pointer}
.swatches .sw.fg{top:0;inset-inline-start:0;z-index:2}
.swatches .sw.bg{bottom:0;inset-inline-end:0}
.mini{display:flex;gap:4px;flex:none}
.mini button{background:none;border:0;color:var(--muted);padding:2px;font-size:11px}

.viewport{position:relative;min-width:0;min-height:0;background:var(--ground);overflow:hidden;touch-action:none}
.viewport canvas#view{position:absolute;inset:0;width:100%;height:100%;display:block}
.drop-hint{position:absolute;inset:14px;border:2px dashed var(--accent);border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-2);font-size:18px;font-weight:600;pointer-events:none}
.text-editor{position:absolute;z-index:5;background:var(--pop);border:1px solid var(--accent);border-radius:10px;padding:8px;box-shadow:0 14px 40px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:6px;width:260px;max-width:calc(100% - 20px)}
.text-editor textarea{background:var(--ground);border:1px solid var(--line-2);border-radius:6px;min-height:70px;resize:vertical;padding:6px;color:var(--fg)}
.zoom-float{position:absolute;bottom:10px;inset-inline-start:10px;display:flex;gap:4px;background:var(--pop);border:1px solid var(--line-2);border-radius:9px;padding:4px;z-index:4}
.zoom-float button{background:none;border:0;color:var(--fg);width:28px;height:26px;border-radius:5px}
.zoom-float button:hover{background:var(--panel-3)}
.zoom-float span{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);align-self:center;min-width:46px;text-align:center;direction:ltr}

/* ---------- panels ---------- */
.panels{background:var(--panel);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.psec{border-bottom:1px solid var(--line)}
.phead{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;font-weight:600;font-size:12px;color:var(--muted);letter-spacing:.03em}
.ptabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none}
.ptabs::-webkit-scrollbar{display:none}
.ptabs button{flex:1;background:none;border:0;padding:9px 8px;color:var(--muted);font-weight:600;font-size:12px;border-bottom:2px solid transparent;white-space:nowrap}
.ptabs button.on{color:var(--accent-2);border-bottom-color:var(--accent)}
.pbody{flex:1;overflow-y:auto;min-height:0;scrollbar-width:thin}
.pane{padding:10px 12px;display:flex;flex-direction:column;gap:10px}

/* color picker */
.cp{padding:4px 12px 12px;display:flex;flex-direction:column;gap:8px}
.cp-sv{position:relative;height:120px;border-radius:7px;overflow:hidden;cursor:crosshair;touch-action:none}
.cp-sv canvas{width:100%;height:100%;display:block}
.cp-knob{position:absolute;width:14px;height:14px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #000,inset 0 0 0 1px #000;transform:translate(-50%,-50%);pointer-events:none}
.cp-bar{position:relative;height:14px;border-radius:7px;cursor:pointer;touch-action:none}
.cp-bar .cp-knob{top:50%}
.cp-hue{background:linear-gradient(90deg,red,#ff0,lime,cyan,blue,#f0f,red)}
.cp-alpha{background-image:linear-gradient(45deg,#555 25%,transparent 25%,transparent 75%,#555 75%),linear-gradient(45deg,#555 25%,#888 25%,#888 75%,#555 75%);background-size:10px 10px;background-position:0 0,5px 5px}
.cp-alpha::after{content:"";position:absolute;inset:0;border-radius:7px;background:linear-gradient(90deg,transparent,var(--cpc,#fff))}
.cp-row{display:flex;gap:6px;align-items:center}
.cp-row input{background:var(--ground);border:1px solid var(--line-2);border-radius:5px;padding:3px 5px;width:100%;min-width:0;font-family:var(--f-mono);font-size:12px;direction:ltr;text-align:center}
.cp-row label{font-size:10.5px;color:var(--dim)}
.cp-target{display:flex;gap:4px}
.cp-target button{flex:1;border:1px solid var(--line-2);background:var(--ground);border-radius:5px;padding:3px;font-size:11.5px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:5px}
.cp-target button.on{border-color:var(--accent);color:var(--accent-2)}
.cp-target i{width:12px;height:12px;border-radius:3px;border:1px solid #000;display:inline-block}
.sw-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.sw-grid button{aspect-ratio:1;border:0;border-radius:3px;padding:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);max-width:100%}
.sw-grid button:hover{transform:scale(1.18);box-shadow:0 0 0 1px #fff}
.lbl{font-size:11px;color:var(--dim);letter-spacing:.03em}

/* layers */
.layer-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.layer-tools select{background:var(--ground);border:1px solid var(--line-2);border-radius:5px;padding:4px;flex:1;min-width:0}
.layers{display:flex;flex-direction:column;gap:3px}
.lrow{display:grid;grid-template-columns:24px 40px 1fr auto;align-items:center;gap:7px;padding:5px 6px;border-radius:7px;border:1px solid transparent;cursor:pointer;min-width:0}
.lrow:hover{background:var(--panel-2)}
.lrow.on{background:var(--accent-soft);border-color:var(--accent-line)}
.lrow.clip{margin-inline-start:16px}
.lrow .eye{background:none;border:0;color:var(--muted);padding:0;display:grid;place-items:center}
.lrow .eye svg{width:17px;height:17px}
.lrow .eye.off{opacity:.35}
.lrow canvas{width:40px;height:30px;border-radius:4px;background:repeating-conic-gradient(#3a3a44 0 25%,#2a2a32 0 50%) 0 0/8px 8px;border:1px solid var(--line-2)}
.lrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.lrow .tags{display:flex;gap:3px;color:var(--dim);font-size:10.5px}
.lrow .tags b{font-weight:600;border:1px solid var(--line-2);border-radius:4px;padding:0 4px}
.icon-row{display:flex;gap:4px;flex-wrap:wrap}

/* grids of presets */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:5px;display:flex;flex-direction:column;gap:4px;align-items:stretch;font-size:11.5px;color:var(--muted);text-align:center}
.tile:hover{border-color:var(--accent);color:var(--accent-2)}
.tile canvas,.tile .thumb{width:100%;aspect-ratio:1;border-radius:5px;display:block;background:var(--ground);max-width:100%}
.hist{display:flex;flex-direction:column;gap:2px}
.hist button{background:none;border:0;text-align:start;padding:6px 8px;border-radius:6px;color:var(--muted);display:flex;gap:8px}
.hist button.on{background:var(--accent-soft);color:var(--accent-2)}
.hist button.future{opacity:.45}
.hist span{font-family:var(--f-mono);font-size:11px;color:var(--dim);min-width:18px}
.prop{display:grid;grid-template-columns:86px 1fr auto;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.prop input[type=range]{width:100%}
.prop output{font-family:var(--f-mono);font-size:11px;color:var(--fg);min-width:32px;text-align:center;direction:ltr}
.prop select,.prop input[type=number],.prop input[type=text]{background:var(--ground);border:1px solid var(--line-2);border-radius:5px;padding:4px 6px;width:100%;min-width:0}
.prop textarea{background:var(--ground);border:1px solid var(--line-2);border-radius:5px;padding:6px;width:100%;grid-column:2/4;min-height:60px;resize:vertical}
.subhead{font-weight:700;font-size:12px;color:var(--fg);display:flex;align-items:center;gap:8px;margin-top:4px}
.subhead::after{content:"";flex:1;border-top:1px solid var(--line)}
.note{font-size:12px;color:var(--muted);line-height:1.6}

.help-card{position:absolute;top:40px;inset-inline-start:12px;z-index:4;width:min(310px,calc(100% - 24px));background:var(--pop);border:1px solid var(--line-2);border-radius:12px;padding:12px 14px;box-shadow:0 16px 40px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:8px;font-size:12.5px;line-height:1.65}
.hc-top{display:flex;align-items:center;gap:9px}
.hc-top b{font-size:14px;color:var(--accent-2);flex:1}
.hc-ic{width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent-2);display:grid;place-items:center;flex:none}
.hc-ic svg{width:18px;height:18px}
.hc-x{background:none;border:0;color:var(--muted);font-size:20px;line-height:1;padding:0 4px}
.help-card p{margin:0;color:var(--fg)}
.help-card ol{margin:0;padding-inline-start:20px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.hc-opt{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--dim);border-top:1px solid var(--line);padding-top:7px}
.g-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.g-row{display:flex;gap:10px;align-items:flex-start;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:10px}
.g-row p{margin:3px 0 0;color:var(--muted);font-size:12px;line-height:1.6}
.g-row kbd{font-family:var(--f-mono);font-size:10.5px;color:var(--dim);border:1px solid var(--line-2);border-radius:4px;padding:0 5px}
@media (max-width:820px){.help-card{top:auto;bottom:52px;font-size:12px}.topbar #btnGuide{order:2}}
.status{display:flex;gap:16px;align-items:center;padding:4px 12px;background:var(--panel);border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden}
.status b{font-family:var(--f-mono);font-weight:500;color:var(--fg);direction:ltr;display:inline-block}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:80;background:rgba(5,4,8,.6);display:grid;place-items:center;padding:16px}
.modal.side{background:transparent;pointer-events:none;place-items:start end;padding:110px 330px 16px 16px}
.dlg{pointer-events:auto;background:var(--pop);border:1px solid var(--line-2);border-radius:14px;width:min(520px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.dlg.wide{width:min(880px,100%)}
.dlg.narrow{width:min(360px,100%)}
.dlg header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);font-family:var(--f-display);font-size:17px;color:var(--accent-2)}
.dlg header button{background:none;border:0;color:var(--muted);font-size:20px;line-height:1}
.dlg .body{padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.dlg footer{display:flex;gap:8px;justify-content:flex-start;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.preset{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:10px;text-align:start;display:flex;flex-direction:column;gap:3px}
.preset b{font-weight:600}
.preset small{color:var(--muted);font-family:var(--f-mono);direction:ltr;text-align:end}
.preset.on,.preset:hover{border-color:var(--accent)}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.proj{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.proj .thumb{aspect-ratio:16/10;background:var(--ground) center/contain no-repeat;max-width:100%}
.proj .meta{padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.proj .meta b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj .meta small{color:var(--dim)}
.proj .acts{display:flex;gap:4px;padding:0 8px 8px;flex-wrap:wrap}
.proj.cur{border-color:var(--accent)}
.badge{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:20px;background:var(--panel-3);color:var(--muted)}
.badge.gold{background:var(--accent-soft);color:var(--accent-2)}
.confirm-row{display:flex;gap:6px;align-items:center;background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.45);border-radius:7px;padding:6px 8px;font-size:12px;flex-wrap:wrap}
.kbd-grid{display:grid;grid-template-columns:1fr auto;gap:6px 18px;font-size:12.5px}
.kbd-grid kbd{font-family:var(--f-mono);background:var(--ground);border:1px solid var(--line-2);border-radius:4px;padding:1px 6px;direction:ltr;font-size:11.5px}

#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
